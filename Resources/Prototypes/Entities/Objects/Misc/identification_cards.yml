- type: entity
  parent: Clothing
  id: IDCardStandard
  name: identification card
  description: A card necessary to access various areas aboard the station.
  abstract: true
  components:
    - type: Sprite
      sprite: Objects/Misc/_Paradise/card.rsi
    - type: Clothing
      slots:
        - idcard
      sprite: Objects/Misc/_Paradise/card.rsi
    - type: Item
      size: Small
      heldPrefix: default
      storedRotation: -90
    - type: Access
    - type: IdCard
    - type: StationRecordKeyStorage
    - type: Tag
      tags:
        - DoorBumpOpener
        - WhitelistChameleon
        - WhitelistChameleonIdCard
    - type: StealTarget
      stealGroup: IDCard

